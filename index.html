<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Recetas de Cocina</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-orange-600 text-white shadow-md sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i data-lucide="utensils"></i> Mis Recetas
            </h1>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <div class="relative w-full sm:w-64">
                    <input type="text" id="searchInput" oninput="filterRecipes()" placeholder="Buscar por título o ingrediente..." 
                           class="w-full pl-9 pr-4 py-2 rounded-xl border-none text-slate-800 focus:outline-none focus:ring-2 focus:ring-orange-300 text-sm shadow-inner">
                    <i data-lucide="search" class="absolute left-2.5 top-2.5 text-gray-400 w-4 h-4"></i>
                </div>
                
                <!-- Botón Nueva Receta (requiere login) -->
                <button id="btnNewRecipe" onclick="openFormModal()" class="bg-orange-800 hover:bg-orange-900 text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-1 shadow transition shrink-0">
                    <i data-lucide="plus" class="w-4 h-4"></i> Nueva
                </button>

                <!-- Área de Usuario / Autenticación -->
                <div id="authContainer" class="flex items-center gap-2 shrink-0">
                    <button id="btnLogin" onclick="openModal('authModal')" class="bg-white/20 hover:bg-white/30 text-white px-3 py-2 rounded-xl text-sm font-medium transition">
                        Iniciar Sesión
                    </button>
                    <button id="btnLogout" onclick="handleLogout()" class="hidden bg-red-700 hover:bg-red-800 text-white px-3 py-2 rounded-xl text-sm font-medium transition">
                        Salir
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
        
        <!-- Filtro por Categorías -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none" id="categoryFilterContainer">
            <!-- Botones de categoría generados dinámicamente -->
        </div>

        <!-- Indicador de Carga -->
        <div id="loadingState" class="text-center py-16 text-orange-600">
            <i data-lucide="loader-2" class="w-10 h-10 mx-auto animate-spin mb-2"></i>
            <p>Cargando recetas de Supabase...</p>
        </div>

        <!-- Grid de Recetas -->
        <div id="recipeGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Las tarjetas se generan dinámicamente -->
        </div>

        <!-- Estado vacío -->
        <div id="emptyState" class="hidden text-center py-16 text-slate-400">
            <i data-lucide="book-open" class="w-16 h-16 mx-auto mb-2 opacity-50"></i>
            <p class="text-lg">No se encontraron recetas.</p>
        </div>
    </main>

    <!-- Modal para Ver Receta Completa -->
    <div id="viewModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6 relative flex flex-col justify-between">
            <div>
                <button onclick="closeModal('viewModal')" class="absolute top-4 right-4 text-gray-400 hover:text-slate-700 bg-gray-100 p-1.5 rounded-full z-10">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
                
                <!-- Vista previa de imagen -->
                <div id="modalImageContainer" class="hidden -mx-6 -mt-6 mb-4 overflow-hidden rounded-t-2xl max-h-56">
                    <img id="modalImage" src="" alt="Receta" class="w-full h-full object-cover">
                </div>

                <h2 id="modalTitle" class="text-2xl font-bold text-orange-600 pr-8 mb-2"></h2>
                <div id="modalCategory" class="inline-block bg-orange-100 text-orange-800 text-xs px-2.5 py-1 rounded-full font-semibold mb-4"></div>
                
                <div class="mb-4">
                    <h3 class="font-bold text-slate-700 border-b pb-1 mb-2 flex items-center gap-1">
                        <i data-lucide="list" class="w-4 h-4"></i> Ingredientes
                    </h3>
                    <p id="modalIngredients" class="whitespace-pre-line text-sm text-slate-600 leading-relaxed"></p>
                </div>

                <div class="mb-6">
                    <h3 class="font-bold text-slate-700 border-b pb-1 mb-2 flex items-center gap-1">
                        <i data-lucide="chef-hat" class="w-4 h-4"></i> Instrucciones
                    </h3>
                    <p id="modalInstructions" class="whitespace-pre-line text-sm text-slate-600 leading-relaxed"></p>
                </div>
            </div>

            <!-- Acciones (Editar y Eliminar Receta) -->
            <div id="modalActions" class="flex justify-end gap-2 pt-4 border-t border-slate-100">
                <button id="btnEdit" class="bg-amber-100 hover:bg-amber-200 text-amber-800 px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
                    <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Editar
                </button>
                <button id="btnDelete" class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Eliminar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal para Agregar/Editar Receta -->
    <div id="formModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl p-6 relative">
            <button onclick="closeModal('formModal')" class="absolute top-4 right-4 text-gray-400 hover:text-slate-700">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h2 id="formModalTitle" class="text-xl font-bold text-slate-800 mb-4">Nueva Receta</h2>
            
            <form id="recipeForm" onsubmit="saveRecipe(event)" class="space-y-4">
                <input type="hidden" id="editingId" value="">
                
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre de la Receta</label>
                    <input type="text" id="recipeTitle" required class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                
                <!-- Selector y Gestión de Categoría -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-bold text-slate-600 uppercase">Categoría</label>
                        <!-- Acciones sobre la categoría seleccionada (Editar/Eliminar solo si es del usuario) -->
                        <div id="categoryActions" class="hidden gap-2 text-xs">
                            <button type="button" onclick="editSelectedCategory()" class="text-amber-600 hover:underline font-medium flex items-center gap-0.5">
                                <i data-lucide="pencil" class="w-3 h-3"></i> Renombrar
                            </button>
                            <button type="button" onclick="deleteSelectedCategory()" class="text-red-600 hover:underline font-medium flex items-center gap-0.5">
                                <i data-lucide="trash-2" class="w-3 h-3"></i> Eliminar
                            </button>
                        </div>
                    </div>
                    <select id="recipeCategorySelect" onchange="handleCategorySelectChange()" required class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none bg-white">
                        <!-- Opciones dinámicas cargadas desde Supabase -->
                    </select>
                    <input type="text" id="recipeCustomCategory" placeholder="Escribe la nueva categoría" class="hidden mt-2 w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
                </div>

                <!-- Campo de Imagen -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Imagen de la Receta (Opcional)</label>
                    <input type="file" id="recipeImage" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Ingredientes</label>
                    <textarea id="recipeIngredients" rows="3" placeholder="Un ingrediente por línea" required class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Instrucciones</label>
                    <textarea id="recipeInstructions" rows="4" placeholder="Paso a paso..." required class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none"></textarea>
                </div>
                <button type="submit" id="btnSaveSubmit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-medium py-2.5 rounded-xl shadow transition flex justify-center items-center gap-2">
                    Guardar Receta
                </button>
            </form>
        </div>
    </div>

    <!-- Modal de Autenticación (Login/Registro) -->
    <div id="authModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-2xl max-w-sm w-full shadow-2xl p-6 relative">
            <button onclick="closeModal('authModal')" class="absolute top-4 right-4 text-gray-400 hover:text-slate-700">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h2 id="authTitle" class="text-xl font-bold text-slate-800 mb-4">Iniciar Sesión</h2>
            
            <form onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                    <input type="email" id="authEmail" required class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Contraseña</label>
                    <input type="password" id="authPassword" required class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                
                <button type="submit" id="btnAuthSubmit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-medium py-2.5 rounded-xl shadow transition">
                    Ingresar
                </button>

                <p class="text-xs text-center text-slate-500 mt-2">
                    <span id="authToggleText">¿No tienes cuenta?</span>
                    <button type="button" onclick="toggleAuthMode()" id="authToggleBtn" class="text-orange-600 font-bold hover:underline">Regístrate</button>
                </p>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://dnbdtqyqtvjoqjjipvhv.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_C5cF9IarEaMRNmb0KZEq4Q_7zYas3Ll';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Variables de Estado
        let recipes = [];
        let categories = []; // [{ id, name, user_id }]
        let selectedCategory = 'Todas';
        let currentUser = null;
        let isSignUpMode = false;

        // Inicialización
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            await checkAuthStatus();
            await fetchCategories();
            await fetchRecipes();
        });

        // ==========================================
        // GESTIÓN DE AUTENTICACIÓN
        // ==========================================
        async function checkAuthStatus() {
            const { data: { user } } = await _supabase.auth.getUser();
            currentUser = user;
            updateAuthUI();

            _supabase.auth.onAuthStateChange((event, session) => {
                currentUser = session?.user || null;
                updateAuthUI();
                fetchCategories();
                fetchRecipes();
            });
        }

        function updateAuthUI() {
            const btnLogin = document.getElementById('btnLogin');
            const btnLogout = document.getElementById('btnLogout');

            if (currentUser) {
                btnLogin.classList.add('hidden');
                btnLogout.classList.remove('hidden');
            } else {
                btnLogin.classList.remove('hidden');
                btnLogout.classList.add('hidden');
            }
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authTitle').textContent = isSignUpMode ? 'Crear Cuenta' : 'Iniciar Sesión';
            document.getElementById('btnAuthSubmit').textContent = isSignUpMode ? 'Registrarse' : 'Ingresar';
            document.getElementById('authToggleText').textContent = isSignUpMode ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?';
            document.getElementById('authToggleBtn').textContent = isSignUpMode ? 'Inicia Sesión' : 'Regístrate';
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            try {
                if (isSignUpMode) {
                    const { error } = await _supabase.auth.signUp({ email, password });
                    if (error) throw error;
                    alert('Registro exitoso. Revisa tu correo si activaste confirmación por email.');
                } else {
                    const { error } = await _supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                }
                closeModal('authModal');
            } catch (error) {
                alert('Error de autenticación: ' + error.message);
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            alert('Sesión cerrada');
        }

        // ==========================================
        // GESTIÓN Y CRUD DE CATEGORÍAS
        // ==========================================
        async function fetchCategories() {
            try {
                const { data, error } = await _supabase
                    .from('categories')
                    .select('id, name, user_id')
                    .order('name', { ascending: true });

                if (error) throw error;
                categories = data || [];

                populateCategorySelect();
                updateCategoryFilters();
            } catch (error) {
                console.error('Error al cargar categorías:', error.message);
            }
        }

        function updateCategoryFilters() {
            const container = document.getElementById('categoryFilterContainer');
            container.innerHTML = '';

            const activeCategoryNames = Array.from(
                new Set(
                    recipes
                        .map(r => r.categories ? r.categories.name : null)
                        .filter(Boolean)
                )
            ).sort();

            const availableFilters = ['Todas', ...activeCategoryNames];

            if (!availableFilters.includes(selectedCategory)) {
                selectedCategory = 'Todas';
            }

            availableFilters.forEach(catName => {
                const btn = document.createElement('button');
                const isActive = selectedCategory === catName;
                btn.className = `px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
                    isActive 
                    ? 'bg-orange-600 text-white shadow-sm' 
                    : 'bg-white text-slate-600 border border-orange-100 hover:bg-orange-100'
                }`;
                btn.textContent = catName;
                btn.onclick = () => {
                    selectedCategory = catName;
                    updateCategoryFilters();
                    filterRecipes();
                };
                container.appendChild(btn);
            });
        }

        function populateCategorySelect() {
            const select = document.getElementById('recipeCategorySelect');
            select.innerHTML = '';

            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = cat.name;
                select.appendChild(option);
            });

            const customOption = document.createElement('option');
            customOption.value = 'custom';
            customOption.textContent = '+ Agregar nueva categoría...';
            select.appendChild(customOption);

            handleCategorySelectChange();
        }

        function handleCategorySelectChange() {
            const select = document.getElementById('recipeCategorySelect');
            const customInput = document.getElementById('recipeCustomCategory');
            const actionsDiv = document.getElementById('categoryActions');

            if (select.value === 'custom') {
                customInput.classList.remove('hidden');
                customInput.required = true;
                actionsDiv.classList.add('hidden');
                actionsDiv.classList.remove('flex');
            } else {
                customInput.classList.add('hidden');
                customInput.required = false;

                // Verificar si la categoría elegida le pertenece al usuario actual
                const catObj = categories.find(c => c.id === select.value);
                const isOwner = currentUser && catObj && catObj.user_id === currentUser.id;

                if (isOwner) {
                    actionsDiv.classList.remove('hidden');
                    actionsDiv.classList.add('flex');
                } else {
                    actionsDiv.classList.add('hidden');
                    actionsDiv.classList.remove('flex');
                }
            }
        }

        async function createCategory(name) {
            try {
                const { data, error } = await _supabase
                    .from('categories')
                    .insert([{ name, user_id: currentUser.id }])
                    .select()
                    .single();

                if (error) throw error;
                await fetchCategories();
                return data.id;
            } catch (error) {
                console.error('Error al crear categoría:', error.message);
                alert('No se pudo crear la categoría: ' + error.message);
                return null;
            }
        }

        async function editSelectedCategory() {
            const select = document.getElementById('recipeCategorySelect');
            const catObj = categories.find(c => c.id === select.value);
            if (!catObj) return;

            const newName = prompt('Editar nombre de la categoría:', catObj.name);
            if (!newName || newName.trim() === '' || newName === catObj.name) return;

            try {
                const { error } = await _supabase
                    .from('categories')
                    .update({ name: newName.trim() })
                    .eq('id', catObj.id);

                if (error) throw error;

                await fetchCategories();
                await fetchRecipes();
                select.value = catObj.id;
                handleCategorySelectChange();
            } catch (error) {
                alert('Error al renombrar la categoría: ' + error.message);
            }
        }

        async function deleteSelectedCategory() {
            const select = document.getElementById('recipeCategorySelect');
            const catObj = categories.find(c => c.id === select.value);
            if (!catObj) return;

            if (confirm(`¿Estás seguro de eliminar la categoría "${catObj.name}"? Las recetas asociadas quedarán sin categoría.`)) {
                try {
                    const { error } = await _supabase
                        .from('categories')
                        .delete()
                        .eq('id', catObj.id);

                    if (error) throw error;

                    await fetchCategories();
                    await fetchRecipes();
                } catch (error) {
                    alert('Error al eliminar categoría: ' + error.message);
                }
            }
        }

        // ==========================================
        // OPERACIONES CRUD RECETAS
        // ==========================================
        async function fetchRecipes() {
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('recipeGrid').classList.add('hidden');

            try {
                const { data, error } = await _supabase
                    .from('recipes')
                    .select('*, categories(id, name)')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                recipes = data || [];

                updateCategoryFilters();
                filterRecipes();
            } catch (error) {
                console.error('Error al cargar recetas:', error.message);
            } finally {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('recipeGrid').classList.remove('hidden');
            }
        }

        async function saveRecipe(event) {
            event.preventDefault();

            if (!currentUser) {
                alert('Debes iniciar sesión para guardar recetas.');
                openModal('authModal');
                return;
            }

            const btnSubmit = document.getElementById('btnSaveSubmit');
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Guardando...';

            const editingId = document.getElementById('editingId').value;
            const select = document.getElementById('recipeCategorySelect');
            const customInput = document.getElementById('recipeCustomCategory');
            const imageInput = document.getElementById('recipeImage');
            
            let categoryId = select.value;

            if (categoryId === 'custom') {
                const newCatName = customInput.value.trim();
                if (!newCatName) {
                    alert('Ingresa el nombre de la nueva categoría.');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Guardar Receta';
                    return;
                }
                
                const existing = categories.find(c => c.name.toLowerCase() === newCatName.toLowerCase());
                if (existing) {
                    categoryId = existing.id;
                } else {
                    categoryId = await createCategory(newCatName);
                    if (!categoryId) {
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = 'Guardar Receta';
                        return;
                    }
                }
            }

            let imageUrl = null;

            try {
                if (imageInput.files.length > 0) {
                    const file = imageInput.files[0];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${currentUser.id}/${Date.now()}.${fileExt}`;

                    const { error: uploadError } = await _supabase.storage
                        .from('recipe-images')
                        .upload(fileName, file);

                    if (uploadError) throw uploadError;

                    const { data: urlData } = _supabase.storage
                        .from('recipe-images')
                        .getPublicUrl(fileName);

                    imageUrl = urlData.publicUrl;
                }

                const payload = {
                    title: document.getElementById('recipeTitle').value,
                    category_id: categoryId,
                    ingredients: document.getElementById('recipeIngredients').value,
                    instructions: document.getElementById('recipeInstructions').value,
                    user_id: currentUser.id
                };

                if (imageUrl) payload.image_url = imageUrl;

                if (editingId) {
                    const { error } = await _supabase
                        .from('recipes')
                        .update(payload)
                        .eq('id', editingId);

                    if (error) throw error;
                } else {
                    const { error } = await _supabase
                        .from('recipes')
                        .insert([payload]);

                    if (error) throw error;
                }

                await fetchRecipes();
                closeModal('formModal');
                document.getElementById('recipeForm').reset();
            } catch (error) {
                alert('Error al guardar la receta: ' + error.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Guardar Receta';
            }
        }

        async function deleteRecipe(id) {
            if (!currentUser) {
                alert('Debes iniciar sesión.');
                return;
            }

            if (confirm('¿Estás seguro de que deseas eliminar esta receta?')) {
                try {
                    const { error } = await _supabase
                        .from('recipes')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;

                    closeModal('viewModal');
                    await fetchRecipes();
                } catch (error) {
                    alert('Error al eliminar: ' + error.message);
                }
            }
        }

        // ==========================================
        // RENDERIZADO Y UI DE RECETAS
        // ==========================================
        function renderRecipes(items) {
            const grid = document.getElementById('recipeGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            if (items.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            items.forEach(recipe => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition cursor-pointer border border-orange-100 flex flex-col justify-between group";
                card.onclick = () => openViewModal(recipe.id);
                
                const hasImage = recipe.image_url ? `<img src="${recipe.image_url}" alt="${escapeHtml(recipe.title)}" class="w-full h-36 object-cover">` : '';
                const categoryName = recipe.categories ? recipe.categories.name : 'Sin categoría';

                card.innerHTML = `
                    <div>
                        ${hasImage}
                        <div class="p-5">
                            <span class="inline-block bg-orange-100 text-orange-700 text-xs font-semibold px-2.5 py-0.5 rounded-full mb-2">${escapeHtml(categoryName)}</span>
                            <h3 class="font-bold text-slate-800 text-lg group-hover:text-orange-600 transition">${escapeHtml(recipe.title)}</h3>
                        </div>
                    </div>
                    <div class="px-5 pb-4 pt-0 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                        <span>Haz click para ver</span>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-orange-500"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function filterRecipes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = recipes.filter(r => {
                const catName = r.categories ? r.categories.name : 'Sin categoría';
                const matchesQuery = (r.title && r.title.toLowerCase().includes(query)) || 
                                     (r.ingredients && r.ingredients.toLowerCase().includes(query));
                const matchesCategory = selectedCategory === 'Todas' || catName === selectedCategory;
                return matchesQuery && matchesCategory;
            });
            renderRecipes(filtered);
        }

        function openViewModal(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            const categoryName = recipe.categories ? recipe.categories.name : 'Sin categoría';

            document.getElementById('modalTitle').textContent = recipe.title;
            document.getElementById('modalCategory').textContent = categoryName;
            document.getElementById('modalIngredients').textContent = recipe.ingredients;
            document.getElementById('modalInstructions').textContent = recipe.instructions;

            const imgContainer = document.getElementById('modalImageContainer');
            const imgEl = document.getElementById('modalImage');
            if (recipe.image_url) {
                imgEl.src = recipe.image_url;
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.classList.add('hidden');
            }

            const isOwner = currentUser && currentUser.id === recipe.user_id;
            document.getElementById('modalActions').style.display = isOwner ? 'flex' : 'none';

            if (isOwner) {
                document.getElementById('btnEdit').onclick = () => openEditFormModal(recipe.id);
                document.getElementById('btnDelete').onclick = () => deleteRecipe(recipe.id);
            }

            openModal('viewModal');
            lucide.createIcons();
        }

        function openFormModal() {
            if (!currentUser) {
                alert('Debes iniciar sesión para publicar una receta.');
                openModal('authModal');
                return;
            }

            document.getElementById('editingId').value = '';
            document.getElementById('formModalTitle').textContent = 'Nueva Receta';
            document.getElementById('recipeForm').reset();
            handleCategorySelectChange();

            openModal('formModal');
        }

        function openEditFormModal(id) {
            closeModal('viewModal');
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            document.getElementById('editingId').value = recipe.id;
            document.getElementById('formModalTitle').textContent = 'Editar Receta';
            document.getElementById('recipeTitle').value = recipe.title;
            document.getElementById('recipeIngredients').value = recipe.ingredients;
            document.getElementById('recipeInstructions').value = recipe.instructions;

            const select = document.getElementById('recipeCategorySelect');

            if (recipe.category_id) {
                select.value = recipe.category_id;
            } else {
                select.value = select.options[0]?.value || '';
            }

            handleCategorySelectChange();
            openModal('formModal');
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
            document.getElementById(modalId).classList.add('flex');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
            document.getElementById(modalId).classList.remove('flex');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
